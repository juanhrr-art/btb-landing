<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Diagnóstico en vivo · Be the Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#121212; --card:#1b1b1b; --g:#EBC55C; --tx:#fff; --mut:#9a9a9a; --line:#2c2c2c; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--tx);font-family:'Figtree',system-ui,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:520px}
  .brand{font-weight:900;font-size:13px;letter-spacing:3px;color:var(--mut);text-transform:uppercase;text-align:center;margin-bottom:22px}
  .brand .dot{color:var(--g)}
  h1{font-weight:900;font-size:34px;line-height:1.05;letter-spacing:-1px;margin-bottom:14px}
  h1 .g{color:var(--g)}
  .lead{color:var(--mut);font-size:17px;font-weight:500;line-height:1.5;margin-bottom:28px}
  .btn{display:block;width:100%;background:var(--g);color:#101010;border:none;border-radius:14px;
    font-family:inherit;font-weight:900;font-size:19px;padding:18px;cursor:pointer;letter-spacing:-.2px}
  .prog{display:flex;gap:6px;margin-bottom:26px}
  .prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
  .prog i.on{background:var(--g)}
  .kick{font-weight:900;font-size:13px;letter-spacing:2px;color:var(--g);text-transform:uppercase;margin-bottom:12px}
  .q{font-weight:900;font-size:26px;line-height:1.15;letter-spacing:-.5px;margin-bottom:24px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--line);
    border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.35;padding:17px 18px;margin-bottom:12px;cursor:pointer;transition:.12s}
  .opt:active{border-color:var(--g);transform:scale(.99)}
  .score{font-weight:900;font-size:88px;line-height:1;letter-spacing:-3px;color:var(--g)}
  .score small{font-size:34px;color:var(--mut);letter-spacing:-1px}
  .band{font-weight:900;font-size:22px;line-height:1.25;margin:16px 0 6px}
  .area{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:22px}
  .area .l{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:900}
  .area .n{font-weight:900;font-size:26px;color:var(--g);margin-top:4px}
  .area .d{color:var(--mut);font-size:15px;font-weight:500;margin-top:8px;line-height:1.45}
  .close{color:var(--mut);font-size:16px;font-weight:700;margin-top:24px;line-height:1.5}
  .hide{display:none}
</style></head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot">&#9679;</span> BE THE BRAND</div>

  <!-- INTRO -->
  <div id="intro">
    <h1>¿Dónde está <span class="g">tu cuello</span>?</h1>
    <p class="lead">Seis preguntas, un minuto. Al final tenés tu número y cuál de tus 6 áreas te está frenando más. Es para vos, no se guarda en ningún lado.</p>
    <button class="btn" onclick="start()">Empezar</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hide">
    <div class="prog" id="prog"></div>
    <div class="kick" id="qkick"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hide">
    <div class="score"><span id="scoreN">0</span><small>/18</small></div>
    <div class="band" id="band"></div>
    <div class="area">
      <div class="l">Tu área más floja</div>
      <div class="n" id="weakArea"></div>
      <div class="d" id="weakDesc"></div>
    </div>
    <p class="close">Guardá tu número. Ahora lo trabajamos en vivo.</p>
  </div>
</div>

<script>
const Q=[
 {a:"Posicionamiento",k:"Tu oferta",q:"¿Podés decir a quién ayudás y con qué resultado en una sola oración?",
  o:["No, me cuesta arrancar","Más o menos, cambia según el día","Sí, la digo clarito"],
  w:"Si no la podés decir en una oración, el cliente te compara por precio. Todo lo demás se apoya acá."},
 {a:"Captación",k:"De dónde llegan",q:"¿Te llegan consultas de gente que no te conocía de antes?",
  o:["Casi nunca, todo es recomendación","A veces, de a saltos","Sí, seguido y sin depender de nadie"],
  w:"Si todo depende de que te recomienden, no tenés un canal, tenés suerte con buena prensa."},
 {a:"Autoridad",k:"Tu contenido",q:"¿Tu contenido te posiciona como referente, o publicás por publicar?",
  o:["Publico por publicar","A veces pega algo","Sí, me llegan clientes por el contenido"],
  w:"Publicar por publicar te mantiene visible para colegas, no para clientes."},
 {a:"Ventas",k:"Cómo vendés",q:"¿Tenés un proceso de venta claro, o improvisás cada conversación?",
  o:["Improviso cada charla","Tengo algo, pero no siempre","Sí, sigo un proceso"],
  w:"Improvisar hace que el cierre dependa del humor del día. Un proceso lo sube sin perseguir a nadie."},
 {a:"Precio",k:"Tu precio",q:"¿Te regatean el precio o te terminan comparando por plata?",
  o:["Siempre me regatean","A veces, según el cliente","No, el precio no se discute"],
  w:"El regateo casi nunca es de plata: es que el otro no ve por qué vos y no el más barato."},
 {a:"Sistema",k:"Cómo corre",q:"¿Tu negocio funciona sin que estés vos empujando cada cosa?",
  o:["Depende 100% de mí","A medias","Sí, corre bastante solo"],
  w:"Si todo pasa por vos, no tenés un negocio: tenés un trabajo que te tiene a vos."}
];
let i=0, scores=[];
const $=id=>document.getElementById(id);
function start(){ $('intro').classList.add('hide'); $('quiz').classList.remove('hide'); render(); }
function render(){
  $('prog').innerHTML = Q.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
  $('qkick').textContent = `${i+1} / 6 · ${Q[i].k}`;
  $('qtext').textContent = Q[i].q;
  $('opts').innerHTML = Q[i].o.map((t,v)=>`<button class="opt" onclick="pick(${v+1})">${t}</button>`).join('');
}
function pick(v){
  scores[i]=v; i++;
  if(i<Q.length){ render(); window.scrollTo(0,0); }
  else finish();
}
function finish(){
  $('quiz').classList.add('hide'); $('result').classList.remove('hide');
  const total = scores.reduce((a,b)=>a+b,0);
  $('scoreN').textContent = total;
  let band;
  if(total<12) band="Hay algo estructural. No es la oferta sola: el sistema pierde en varios lados.";
  else if(total<=15) band="El cuello es la oferta. Justo lo que trabajamos hoy.";
  else band="Sos de los pocos. Igual, hoy le encontramos el próximo escalón.";
  $('band').textContent = band;
  // área más floja: menor puntaje; empate -> la primera (Posicionamiento = la oración)
  let min=Math.min(...scores), idx=scores.indexOf(min);
  $('weakArea').textContent = Q[idx].a;
  $('weakDesc').textContent = Q[idx].w;
}
</script>
</body></html>
