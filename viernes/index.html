<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viernes — Be the Brand</title>
<meta name="description" content="Registro semanal del Proceso BTB.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&display=swap">
<style>
:root{ --cream:#F5F0E8; --dark:#1C1C1A; --gray:#6B6B68; --light-gray:#E8E3DA; --yellow:#F0C93A; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--dark);
  font:400 17px/1.65 'Figtree',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;padding:44px 20px 90px}
.wrap{max-width:620px;margin:0 auto}
.marca{display:flex;align-items:center;gap:9px;font-weight:900;font-size:11px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--gray)}
.marca b{color:var(--yellow);font-size:15px;line-height:0}
h1{margin:16px 0 0;font-weight:900;font-size:40px;line-height:1.02;letter-spacing:-1.3px}
.bajada{margin:14px 0 0;color:var(--gray);font-size:17px}
.fecha{margin:10px 0 0;color:var(--gray);font-size:14px}
h2{margin:46px 0 0;font-weight:900;font-size:21px;line-height:1.25;letter-spacing:-.4px}
p{margin:12px 0 0}
ul{margin:12px 0 0;padding-left:22px}
li{margin:7px 0}
b,strong{font-weight:900}
.destacado{background:#fff;border:1px solid var(--light-gray);border-left:4px solid var(--yellow);
  border-radius:0 12px 12px 0;padding:22px 24px;margin:18px 0 0}
.destacado p:first-child{margin-top:0}
hr{border:0;border-top:1px solid var(--light-gray);margin:44px 0 0}
.cierre{margin:26px 0 0;color:var(--gray);font-size:16px}
.pie{margin:52px 0 0;padding-top:22px;border-top:1px solid var(--light-gray);
  color:var(--gray);font-size:14px}
a{color:var(--dark)}

form{margin:30px 0 0}
label{display:block;margin:24px 0 0;font-weight:700;font-size:16px;line-height:1.35}
label small{display:block;font-weight:400;color:var(--gray);font-size:14px;margin-top:3px}
input,textarea,select{display:block;width:100%;margin:9px 0 0;padding:13px 14px;font:400 16px/1.4 'Figtree',sans-serif;
  color:var(--dark);background:#fff;border:1px solid var(--light-gray);border-radius:10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--yellow);border-color:var(--yellow)}
textarea{min-height:92px;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:480px){.fila{grid-template-columns:1fr}}
button{margin:34px 0 0;width:100%;padding:16px;font:900 17px 'Figtree',sans-serif;color:var(--dark);
  background:var(--yellow);border:0;border-radius:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.estado{margin:16px 0 0;font-size:15px;color:var(--gray);min-height:22px}
.listo{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="marca"><b>●</b> Be the Brand</div>
<h1>Tu semana</h1>
<p class="bajada">Dos minutos. Con esto llego a la sesión sabiendo dónde estás, y es el registro que cuenta para la garantía.</p>
<form id="f">
<label>Tu nombre<input name="nombre" required autocomplete="name"></label>
<div class="fila">
<label>A cuánta gente nueva le escribiste<input name="contactados" type="number" min="0" inputmode="numeric" required></label>
<label>Con cuántas personas nuevas hablaste<input name="conversaciones" type="number" min="0" inputmode="numeric" required></label>
<label>Llamadas de venta que tuviste<input name="llamadas" type="number" min="0" inputmode="numeric" required></label>
<label>Ventas que cerraste<input name="ventas" type="number" min="0" inputmode="numeric" required></label>
</div>
<label>De esas ventas, cuántas no vinieron por recomendación<small>Cuenta la persona que no te llegó por un cliente, un conocido o un ex cliente.</small><input name="ventas_sin_recomendacion" type="number" min="0" inputmode="numeric"></label>
<label>Si vendiste, de dónde vino cada cliente<input name="origen_ventas"></label>
<label>Qué te trabó o qué te salió bien esta semana<small>Una línea alcanza.</small><textarea name="comentario"></textarea></label>
<button type="submit">Enviar</button>
<p class="estado" id="estado"></p>
</form>
<div class="listo destacado" id="listo"><p><b>Listo, ya quedó registrado.</b></p><p>Nos vemos en la sesión.</p></div>
<p class="pie">Lo que escribís acá lo leo solo yo. Juan Herrera · Be the Brand</p>
</div>
<script>
const q=new URLSearchParams(location.search);const c=(q.get('c')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
const f=document.getElementById('f'),b=f.querySelector('button'),e=document.getElementById('estado');
try{const n=localStorage.getItem('btb_nombre');if(n&&f.nombre&&!f.nombre.value)f.nombre.value=n;}catch(_){}
f.addEventListener('submit',async ev=>{ev.preventDefault();b.disabled=true;e.textContent='Guardando...';
 const d=Object.fromEntries(new FormData(f));d.tipo='viernes';d.cliente=c;
 try{localStorage.setItem('btb_nombre',d.nombre||'');}catch(_){}
 try{const r=await fetch('https://btb-capture.vercel.app/api/proceso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  const j=await r.json();if(!j.ok)throw 0;f.style.display='none';e.textContent='';document.getElementById('listo').style.display='block';scrollTo(0,0);}
 catch(_){b.disabled=false;e.textContent='No se pudo guardar. Probá de nuevo en un minuto, y si sigue fallando mandame las respuestas por WhatsApp.';}});
</script>
</body>
</html>
